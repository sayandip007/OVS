services:
  postgres-db:
    image: postgres:16-alpine
    container_name: ovs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ovs_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ovs_secret_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ovs_db}
    ports:
      - "5432:5432"
    volumes:
      - ovs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ovs_admin} -d $${POSTGRES_DB:-ovs_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ovs-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ovs_admin}:${POSTGRES_PASSWORD:-ovs_secret_dev}@postgres-db:5432/${POSTGRES_DB:-ovs_db}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-dev_session_secret_32_characters_long_min}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      ALLOW_OTP_INSPECTION: "true"
      OVS_ALLOW_DEMO_SEED: "true"
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    depends_on:
      postgres-db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy --schema=prisma/schema.prisma && npx tsx prisma/seed-demo.ts && npm run dev"

  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    container_name: ovs-frontend
    restart: unless-stopped
    environment:
      VITE_DATA_SOURCE_MODE: ${VITE_DATA_SOURCE_MODE:-LOCAL_DEMO}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api/v1}
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
    depends_on:
      backend-api:
        condition: service_started
    command: npm run dev

volumes:
  ovs_pgdata:
    driver: local
