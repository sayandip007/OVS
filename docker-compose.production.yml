# ==============================================================================
# OVS Production-Grade Docker Compose Stack
# ==============================================================================
# Architecture:
# [Client Browser] -> [frontend-proxy:80 (Nginx)] -> Static Files (SPA)
#                                                \-> [backend-api:5000] -> [postgres-db:5432]
# Internal database port is isolated and never published directly to the host.

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: ovs-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ovs_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}
      POSTGRES_DB: ${POSTGRES_DB:-ovs_production}
    volumes:
      - ovs_prod_pgdata:/var/lib/postgresql/data
      - ./scripts/backup/init-pg-wal.sql:/docker-entrypoint-initdb.d/init-pg.sql:ro
    networks:
      - ovs_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ovs_prod_user} -d $${POSTGRES_DB:-ovs_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ovs-prod-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ovs_prod_user}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB:-ovs_production}?schema=public&sslmode=prefer
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be provided and >= 32 chars}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
    networks:
      - ovs_internal_net
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend-proxy:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_DATA_SOURCE_MODE: LOCAL_DEMO
    container_name: ovs-prod-frontend
    restart: unless-stopped
    ports:
      - "${OVS_HTTP_PORT:-80}:80"
    networks:
      - ovs_internal_net
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  ovs_internal_net:
    driver: bridge

volumes:
  ovs_prod_pgdata:
    name: ovs_prod_pgdata
    driver: local
