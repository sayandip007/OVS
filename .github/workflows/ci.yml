name: OVS CI — Frontend, Architecture, PostgreSQL 16 & Backend Foundation

on:
  push:
    branches: [main, master, 'phase-*']
  pull_request:
    branches: [main, master]

jobs:
  frontend-and-architecture:
    name: Frontend & Architecture Verification (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 1. Frontend lint
        run: npm run lint

      - name: 2. Frontend typecheck / syntax check
        run: npm run typecheck

      - name: 3. Frontend unit & service tests (37 tests)
        run: npm test

      - name: 4. Architecture & SQL consistency tests (55 tests)
        run: npm run test:architecture

      - name: 5. Frontend production build
        run: npm run build

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E test suite
        run: npm run test:e2e

  backend-and-postgresql-verification:
    name: Backend Foundation & Live PostgreSQL 16 Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: ovs_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ovs_ci_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/ovs_ci_test?schema=public
      CLIENT_ORIGIN: http://localhost:3000
      SESSION_SECRET: ci-verification-session-secret-minimum-32-chars-2026
      LOG_LEVEL: silent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 6. Prisma schema validation
        run: npm run prisma:validate

      - name: 7. Prisma client generation
        run: npm run prisma:generate

      - name: 8. Backend lint
        run: npm run backend:lint

      - name: 9. Backend TypeScript typecheck & build
        run: |
          npm run backend:typecheck
          npm run backend:build

      - name: 10. Backend unit tests
        run: npm run backend:test:unit

      - name: 11. Bootstrap Phase 8.1.6 schema & apply CUSTOM_DATABASE_INTEGRITY.sql triggers/constraints
        run: |
          npx prisma db push --schema=docs/backend-architecture/PRISMA_SCHEMA_DRAFT.prisma --skip-generate
          PG_URI="${DATABASE_URL%\?*}"
          psql "$PG_URI" -v ON_ERROR_STOP=1 -f docs/backend-architecture/CUSTOM_DATABASE_INTEGRITY.sql

      - name: 12. Execute Phase 8.1.6 PostgreSQL 31-scenario validation suite on live PostgreSQL 16
        run: |
          PG_URI="${DATABASE_URL%\?*}"
          psql "$PG_URI" -v ON_ERROR_STOP=1 -f tests/postgresql-validation.sql

      - name: 13. Reset schema & apply full Prisma migrations (Phases 8.2-8.4) for seeded verification
        run: |
          PG_URI="${DATABASE_URL%\?*}"
          psql "$PG_URI" -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          npm run prisma:migrate:deploy

      - name: 14. Execute idempotent DEMO_SAMPLE Prisma seed (twice to verify idempotency)
        run: |
          npm run prisma:seed
          npm run prisma:seed

      - name: 15. Execute Backend API Supertest integration tests against live seeded PostgreSQL 16
        run: npm run backend:test:integration

      - name: 16. Verify controlled SUPER_ADMIN bootstrap CLI idempotency against PostgreSQL 16
        env:
          BOOTSTRAP_SUPER_ADMIN_CODE: ECI-SUPER-BOOT-01
          BOOTSTRAP_SUPER_ADMIN_EMAIL: super.boot@ovs-ci.local
          BOOTSTRAP_SUPER_ADMIN_NAME: CI Bootstrapped Super Admin
          BOOTSTRAP_SUPER_ADMIN_PASSWORD: CiBootstrap#2026Strong!
        run: |
          npm run backend:admin:bootstrap
          npm run backend:admin:bootstrap

  docker-and-deployment-verification:
    name: Docker Stack & Deployment Script Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Development Configuration
        run: docker compose -f docker-compose.yml config

      - name: Validate Docker Compose Production Configuration
        env:
          POSTGRES_PASSWORD: ci_sample_prod_password_123
          SESSION_SECRET: ci_sample_prod_session_secret_32_characters_min
        run: docker compose -f docker-compose.production.yml config

      - name: Validate Backup & Recovery Shell Scripts Syntax
        run: |
          bash -n scripts/backup/backup.sh
          bash -n scripts/backup/restore-verify.sh
