name: OVS Release Automation & Container Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  verify-and-package:
    name: Build, Verify, SBOM & Package Container Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Lint & Unit Tests
        run: |
          npm run lint
          npm test

      - name: Run Backend Typecheck & Unit Tests
        run: |
          npm run backend:typecheck
          npm run backend:test:unit

      - name: Build Frontend Static Bundle
        run: npm run build

      - name: Build Backend TypeScript
        run: npm run backend:build

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          mkdir -p build/sbom
          npm list --json --long > build/sbom/dependencies-tree.json
          echo "{\"spdxVersion\": \"SPDX-2.3\", \"dataLicense\": \"CC0-1.0\", \"name\": \"OVS\", \"version\": \"${{ github.ref_name || inputs.release_version }}\"}" > build/sbom/ovs-sbom.spdx.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ovs-backend:${{ github.ref_name || inputs.release_version }}

      - name: Build Frontend Proxy Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: ovs-frontend:${{ github.ref_name || inputs.release_version }}

      - name: Upload Build Artifacts & SBOM
        uses: actions/upload-artifact@v4
        with:
          name: ovs-release-sbom-${{ github.ref_name || inputs.release_version }}
          path: build/sbom/
